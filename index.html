<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./src/output.css">
    <script src="index.js"></script>
    <title>Minesweeper</title>
</head>

<body class="overflow-hidden font-[Geomatrix] bg-[#E4AEA2] min-h-screen flex flex-col items-center justify-center px-4 py-8 overflow-x-hidden">

    <h1 class="drop-shadow-[0_3.5px_1.2px_rgba(70,60,0,0.55)] font-[Minesweeper] text-[#F8F2DC] text-center tracking-widest mb-6
               text-4xl sm:text-6xl md:text-7xl lg:text-8xl ">&VeryThinSpace;Minesweeper</h1>

    
    <!-- Main card -->
    <div class="bg-[#7E2828] rounded-2xl w-full max-w-xs sm:max-w-sm md:max-w-xl lg:max-w-2xl
    flex flex-col gap-3 p-4 sm:p-5 md:p-6">
    
    <!--Everything except for start button-->
    <div class="grid grid-cols-1 gap-3 w-full min-w-0">
        
        <!-- Mines row -->
        <div class="bg-[#f8f2dc] flex flex-col sm:flex-row items-center gap-3 w-full min-w-0 rounded-xl px-4 py-3 min-h-1/3">
            <div class="flex items-center gap-3 w-full sm:flex-1">
                <label for="bombs" class="text-base sm:text-2xl md:text-3xl font-[Geomatrix] whitespace-nowrap w-15 sm:w-15 md:w-18">
                    Mines:
                </label>
                <custom-range min="0" value="20" id="bombs" class="flex-1 min-w-0 scale-80"></custom-range>
            </div>
                <div class="flex items-center gap-3 w-full sm:flex-1">
                    <output id="bomb%" class="text-base sm:text-2xl md:text-3xl font-[Geomatrix] "></output>
                </div>
        </div>


        
            <!-- Rows + Columns -->
            <div>
                <div class="bg-[#f8f2dc] flex flex-col md:flex-row lg:gap-3 items-center min-w-0 w-full rounded-xl px-4 py-3 min-h-1/3">
                    <div class="flex items-center gap-3 w-full sm:flex-1 ">
                        <label for="yWidth" class="text-base sm:text-2xl md:text-3xl font-[Geomatrix] whitespace-nowrap w-15 sm:w-20 md:w-18">
                            Rows:
                        </label>
                        <custom-range min="1" value="10" id="yWidth" class="flex-1 min-w-0 scale-80"></custom-range>
                    </div>
                    <div class="flex items-center gap-3 w-full sm:flex-1">
                        <label for="xWidth" class="text-base sm:text-2xl md:text-3xl font-[Geomatrix] whitespace-nowrap w-15 sm:w-20 md:w-30">
                            Columns:
                        </label>
                        <custom-range min="1" value="10" id="xWidth" class="flex-1 min-w-0 scale-80"></custom-range>
                    </div>
                </div>
            </div>

        <!-- BGM row -->
        <div class="bg-[#e4aea2] flex items-center md:gap-3 min-w-0 w-full rounded-xl px-4 py-3 min-h-1/3">
            <p class="text-[#7E2828] text-base sm:text-lg md:text-xl font-[Geomatrix] ">BGM</p>
            <custom-picker id="bgm" class="flex-1 min-w-0 w-full scale-80"></custom-picker>
        </div>
    </div>

    <div>

        <!-- Start button -->
        <button type="button" id="start"
            class="font-normal font-[Inter] bg-[#f8f2dc] text-[#7E2828] text-center rounded-xl w-full
                   drop-shadow-lg/75
                   text-4xl sm:text-5xl md:text-6xl lg:text-7xl
                   py-5 sm:py-6 md:py-7
                   tracking-widest hover">
            Start
        </button>

    </div>
</body>

</html>
